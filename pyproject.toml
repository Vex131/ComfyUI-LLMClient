[project]
name = "comfyui-llmclient"
description = "OpenAI-compatible LLM client nodes for ComfyUI (any provider: llama.cpp, vLLM, NInfer, Strata, OpenAI)"
version = "0.2.0"
license = { text = "MIT" }
dependencies = [
    "filelock>=3.13",
    "aiohttp>=3.9",
    "numpy",
    "sentence-transformers>=3.4,<6",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
]

[project.urls]
Repository = "https://github.com/Vex131/ComfyUI-LLMClient"

[tool.comfy]
PublisherId = "vex131"
DisplayName = "ComfyUI-LLMClient"
License = "MIT"
